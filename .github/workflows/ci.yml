name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: brain is not installed on this runner
        run: "! command -v brain"
      - uses: actions/checkout@v4
        with:
          # run-all.sh compares against the current version's tag, so it needs the tags.
          fetch-depth: 0
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: bash tests/run-all.sh

  with-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch v1.0.0 https://github.com/arnelirobles/brain.git ../brain
      - run: LEAN_E2E_BRAIN=../brain/tools/brain python3 lib/testq/selftest.py --self-test
      - run: LEAN_E2E_BRAIN=../brain/tools/brain python3 tools/test-phase --self-test
